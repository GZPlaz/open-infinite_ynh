#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

    # OpenInfinite is a static single-page app: every page, problem and PDF is
    # generated in the visitor's browser. nginx only serves files.
    alias __INSTALL_DIR__/;
    index index.html;

    # Client-side routing (history mode): unknown paths get the app shell.
    try_files $uri $uri/ __PATH__/index.html;

    # The build uses relative asset URLs; a <base> tag makes them resolve from
    # the app root even on deep links such as __PATH__/some/route.
    sub_filter '<head>' '<head><base href="__PATH__/">';
    sub_filter_once on;

    # index.html, sw.js, config.json and the web manifest are tiny and must
    # revalidate, so upgrades are picked up on the next visit.
    more_set_headers "Cache-Control: no-cache";

    # Content-hashed bundles and KaTeX fonts never change: cache them for a
    # year and serve the pre-compressed .gz copies (no CPU spent compressing).
    location __PATH__/assets/ {
        alias __INSTALL_DIR__/assets/;
        gzip_static on;
        more_set_headers "Cache-Control: public, max-age=31536000, immutable";
        access_log off;
    }
}

#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "openinfinite"
name = "OpenInfinite"
description.en = "Printable math worksheets with answer keys, generated in the browser"
description.fr = "Fiches d'exercices de maths imprimables avec corrigés, générées dans le navigateur"

version = "0.1.0~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://github.com/GZPlaz/yunohost-new-app"
code = "https://github.com/GZPlaz/yunohost-new-app"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
# Static files only: any CPU architecture works, nothing is compiled on the server.
architectures = "all"
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "20M"
ram.build = "50M"
ram.runtime = "10M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/openinfinite"

    [install.init_main_permission]
    help.en = "Worksheets are generated in each visitor's browser; the server only serves static files."
    help.fr = "Les fiches sont générées dans le navigateur de chaque visiteur ; le serveur ne sert que des fichiers statiques."
    type = "group"
    default = "visitors"

    [install.default_paper]
    ask.en = "Default paper size for new worksheets"
    ask.fr = "Format de papier par défaut des nouvelles fiches"
    type = "select"
    choices.letter = "US Letter"
    choices.a4 = "A4"
    default = "letter"

[resources]
    [resources.sources]

        [resources.sources.main]
        # Pre-built static release (see .github/workflows/release.yml): no Node.js and no build on the server.
        url = "https://github.com/GZPlaz/yunohost-new-app/releases/download/v0.1.0/openinfinite-0.1.0.tar.gz"
        sha256 = "beed2ee6a52444b335019290ee66a8369d2b7bc007eb45cdfb3db8cdf2fc87a8"
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "^openinfinite-.*\\.tar\\.gz$"

    [resources.system_user]

    [resources.install_dir]
    # nginx (www-data) serves the files directly
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

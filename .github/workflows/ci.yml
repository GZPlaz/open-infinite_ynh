name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App — typecheck, answer-key fuzzing, build, end-to-end
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests (every topic, difficulty and option is fuzzed and its answers checked)
        run: npm test
      - run: npm run build
      - name: End-to-end in headless Chrome
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee e2e.log || {
            { grep -A8 '✗' e2e.log; tail -15 e2e.log; } | sed 's/^/::error::/'
            exit 1
          }
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Keep screenshots and exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: app/e2e/output
          if-no-files-found: ignore

  package:
    name: YunoHost package — lint, nginx, reproducible archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install nginx (with headers-more) and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx libnginx-mod-http-headers-more-filter shellcheck
      - name: Shellcheck the package scripts
        run: shellcheck -s bash -e SC1091,SC2154 scripts/* tools/*.sh
      - name: manifest.json mirrors manifest.toml
        run: python3 tools/sync_manifest.py check
      - name: Build the release archive twice and compare
        run: |
          tools/build-release.sh
          cp release/openinfinite-*.tar.gz /tmp/first.tar.gz
          tools/build-release.sh
          cmp release/openinfinite-*.tar.gz /tmp/first.tar.gz
      - name: Serve the build through conf/nginx.conf (sub-path and root installs)
        run: |
          sudo tools/test-nginx.sh /openinfinite
          sudo tools/test-nginx.sh /
